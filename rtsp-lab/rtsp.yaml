apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-sports-demo
  labels:
    app: rtsp-sports-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rtsp-sports-demo
  template:
    metadata:
      labels:
        app: rtsp-sports-demo
    spec:
      # The image built on the supplied host is linux/amd64.
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rtsp
          image: docker.io/aryansr/rtsp-sports-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtsp
              containerPort: 8554
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            exec:
              command: [/healthcheck.sh]
            periodSeconds: 5
            timeoutSeconds: 12
            failureThreshold: 12
          readinessProbe:
            exec:
              command: [/healthcheck.sh]
            periodSeconds: 15
            timeoutSeconds: 12
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: rtsp
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-sports-demo
spec:
  type: ClusterIP
  selector:
    app: rtsp-sports-demo
  ports:
    - name: rtsp
      port: 8554
      targetPort: rtsp
      protocol: TCP
