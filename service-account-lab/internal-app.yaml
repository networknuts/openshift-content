apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-monitor
  namespace: monitoring-lab
  labels:
    app: python-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-monitor
  template:
    metadata:
      labels:
        app: python-monitor
    spec:
      # Deliberately omitted at first:
      # serviceAccountName: internal-monitor
      # The pod therefore starts as the namespace's default service account.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: docker.io/aryansr/monitoring-ocp-app:1.0
          imagePullPolicy: Always
          env:
            - name: MONITOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONITOR_INTERVAL_SECONDS
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
